# Render.com blueprint — deploys MedVault as a public demo.
#
# Usage: push this repo to GitHub, then in Render choose
# "New → Blueprint" and point it at the repo. Render reads this file.
# JWT_SECRET is generated by Render, so no secret is committed here.
#
# The backend seeds its SQLite database from the trained models on first boot
# (backend/entrypoint.sh). The disk below keeps that database across restarts.
services:
  - type: web
    name: medvault-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free         # free tier sleeps; starter keeps the demo responsive
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: medvault-web
          property: host
  - type: web
    name: medvault-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: medvault-api
          property: host
    routes:
      - type: rewrite       # SPA fallback
        source: /*
        destination: /index.html
